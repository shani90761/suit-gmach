<title>דמו חליפות לשמחות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@400;500;700&display=swap">
<style>
/* Layout: the real app's shell — navy sidebar + content; single light look by choice (matches the brand kit) */
:root{
  --stone:#E3D5BA; --stone-lt:#F3ECDD; --bg:#F7F3EA; --panel:#FFFFFF; --navy:#22304A; --navy-dk:#182338;
  --copper:#A6743F; --copper-lt:#C99A63; --fg:#1B2233; --muted:#6C6A64; --line:#E1D8C6;
  --ok:#2F6B45; --ok-bg:#E5F0E8; --warn:#8A5A12; --warn-bg:#FBEFD9; --bad:#A2433A; --bad-bg:#F7E6E3;
  --display:"Frank Ruhl Libre","David Libre",Georgia,serif; --body:"Heebo","Arial Hebrew",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;direction:rtl}
a{color:var(--navy);cursor:pointer}
.demo-bar{background:var(--copper);color:#fff;text-align:center;font-size:13px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo-bar button{font:inherit;background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:4px;padding:1px 8px;margin-inline-start:8px;cursor:pointer}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 30px)}
@media (max-width:820px){.layout{grid-template-columns:1fr}.nav{grid-template-columns:repeat(4,minmax(0,1fr))!important}.side{padding-left:max(16px,env(safe-area-inset-left,0px))!important;padding-right:max(16px,env(safe-area-inset-right,0px))!important}.logo{display:none!important}}
.side{background:var(--navy);color:var(--stone-lt);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.logo{display:grid;justify-items:center;gap:2px;text-align:center;padding-bottom:14px;border-bottom:1px solid rgba(243,236,221,.15)}
.logo .gm{font-family:var(--display);color:var(--copper-lt);letter-spacing:.35em;font-size:12px}
.logo .big{font-family:var(--display);font-weight:900;font-size:22px;line-height:1.1}
.logo .city{color:var(--copper-lt);font-size:11px;letter-spacing:.35em}
.nav{display:grid;gap:2px}
.nav a{color:var(--stone-lt);text-decoration:none;padding:8px 12px;border-radius:6px;font-size:14px}
.nav a:hover{background:rgba(243,236,221,.08)}
.nav a.on{background:var(--stone-lt);color:var(--navy);font-weight:700}
.nav a.new{background:var(--copper);color:#fff;font-weight:700;text-align:center}
.main{padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;max-width:1120px;width:100%}
@media (min-width:821px){.main{padding-left:28px;padding-right:28px}}
h1{font-family:var(--display);font-size:26px;margin:0 0 4px;text-wrap:balance}
h2{font-family:var(--display);font-size:19px;margin:0}
.sub{color:var(--muted);margin:0 0 18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:980px){.g2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card h2{margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 .n{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500}
.alert{border-radius:8px;padding:14px 16px;border:1px solid}
.alert.bad{background:var(--bad-bg);border-color:#E4BDB7;color:var(--bad)}
.alert.warn{background:var(--warn-bg);border-color:#EBD3A6;color:var(--warn)}
.alert h2{color:inherit;margin-bottom:6px}
.alert ul{margin:0;padding-inline-start:18px}
.alert a{color:inherit;font-weight:700}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:max(20px,env(safe-area-inset-left,0px));background:var(--ok-bg);color:var(--ok);border:1px solid #BFD9C7;border-radius:6px;padding:10px 16px;box-shadow:0 4px 14px rgba(0,0,0,.08);max-width:calc(100% - 40px);z-index:20}
.toast.error{background:var(--bad-bg);color:var(--bad);border-color:#E4BDB7}
table{width:100%;border-collapse:collapse}
th{text-align:right;font-weight:500;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);padding:6px 8px}
td{border-bottom:1px solid var(--line);padding:8px;vertical-align:middle}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.num{font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:6px 0}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--stone-lt);color:var(--navy);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.muted{background:#EEE;color:#777}
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:700;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:6px;padding:7px 16px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--navy-dk)}
.btn.sec{background:var(--panel);color:var(--navy)} .btn.sec:hover{background:var(--stone-lt)}
.btn.copper{background:var(--copper);border-color:var(--copper)}
.btn.danger{background:var(--panel);color:var(--bad);border-color:#D8A9A2}
.btn.sm{padding:3px 10px;font-size:13px;font-weight:500}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--copper);outline-offset:1px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--panel);border:1px solid #CFC4AE;border-radius:6px;padding:7px 10px;min-width:0;width:100%}
input[type=checkbox]{width:auto}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row > label{flex:1 1 160px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{display:flex!important;flex-direction:row;gap:8px;align-items:center;color:var(--fg)!important;font-size:14px}
.free{font-weight:700;font-size:18px} .free.zero{color:var(--bad)}
.board td,.board th{text-align:center;padding:5px 4px;font-size:13px}
.board td:first-child,.board th:first-child{text-align:right;white-space:nowrap}
.board .z{background:var(--bad-bg);color:var(--bad);font-weight:700} .board .low{background:var(--warn-bg)} .board .wk{color:var(--copper);font-weight:700}
.suggest{border:1px solid var(--copper-lt);background:#FBF6EA;border-radius:8px;padding:12px;display:grid;gap:8px}
.suggest .who{display:flex;gap:8px;flex-wrap:wrap}
.line{display:grid;grid-template-columns:1.2fr .8fr 1.2fr auto;gap:8px;align-items:end}
@media (max-width:640px){.line{grid-template-columns:1fr 1fr}}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.hint{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;color:var(--navy);font-weight:500}
.mthumb{width:54px;height:54px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);flex:0 0 auto}
.guide{background:var(--panel);border:1px dashed var(--copper-lt);border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.guide b{color:var(--copper)}
</style>

<div class="demo-bar">דמו לחיץ · הנתונים לדוגמה בלבד, ושום מייל לא נשלח באמת <button id="reset">איפוס הדמו</button></div>
<div class="layout">
  <aside class="side">
    <div class="logo"><span class="gm">גמ״ח</span><span class="big">חליפות לשמחות</span><span class="city">ירושלים</span></div>
    <nav class="nav" id="nav">
      <a class="new" href="#new">+ הזמנה חדשה</a>
      <a href="#dash" data-r="dash">מסך ראשי</a>
      <a href="#avail" data-r="avail">בדיקת זמינות</a>
      <a href="#board" data-r="board">לוח זמינות</a>
      <a href="#orders" data-r="orders">הזמנות</a>
      <a href="#customers" data-r="customers">לקוחות</a>
      <a href="#inventory" data-r="inventory">ז׳קטים ודגמים</a>
      <a href="#settings" data-r="settings">הגדרות</a>
    </nav>
  </aside>
  <main class="main" id="app"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// ---------- dates ----------
const DAY=86400000;
const TODAY=(()=>{const d=new Date();d.setHours(12,0,0,0);return d})();
const addD=(d,n)=>new Date(d.getTime()+n*DAY);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromIso=s=>{const [y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd,12)};
const diff=(a,b)=>Math.round((fromIso(a)-fromIso(b))/DAY);
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const dShort=s=>{const d=fromIso(s);return `${d.getDate()}.${d.getMonth()+1}`};
const dLong=s=>{const d=fromIso(s);return `${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`};
const dDay=s=>`יום ${DAYS[fromIso(s).getDay()]}`;
const T=iso(TODAY);
const pickup=o=>iso(addD(fromIso(o.event),-1)), ret=o=>iso(addD(fromIso(o.event),1));
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- demo data ----------
function seed(){
  const models=[{id:1,name:'קטיפה שחורה'},{id:2,name:'שמנת'}];
  const jackets=[];let tag=1;
  [[1,{2:2,4:2,6:3,8:3,10:2,12:2}],[2,{2:1,4:2,6:2,8:2,10:1}]].forEach(([m,s])=>Object.entries(s).forEach(([size,n])=>{for(let i=0;i<n;i++)jackets.push({id:tag,tag:tag++,model:m,size,active:true,note:''})}));
  const j=jackets.find(x=>x.model===2&&x.size==='10'); j.active=false; j.note='קרע בשרוול';
  const customers=[
    {id:1,name:'משה כהן',phone:'0527000001',email:'cohen@example.com',notes:''},
    {id:2,name:'יעקב לוי',phone:'0527000002',email:'',notes:'מעדיף שיחה בערב'},
    {id:3,name:'שמואל פרידמן',phone:'0527000003',email:'fr@example.com',notes:''},
    {id:4,name:'אברהם גולדברג',phone:'0527000004',email:'',notes:''},
    {id:5,name:'רחל כהן',phone:'0527000001',email:'',notes:'סבתא — אותו טלפון של משה כהן'},
  ];
  const E=n=>iso(addD(TODAY,n));
  const orders=[
    {id:101,customer:1,event:E(1),status:'booked',paid:false,fitting:'מדדו ביום א׳',note:'',lines:[{id:1,model:1,size:'8',child:'יוסי'},{id:2,model:1,size:'6',child:'משה'}]},
    {id:102,customer:2,event:E(2),status:'booked',paid:false,fitting:'',note:'',lines:[{id:3,model:2,size:'4',child:''}]},
    {id:103,customer:3,event:E(-4),status:'picked',paid:false,fitting:'',note:'',lines:[{id:4,model:1,size:'10',child:'שמואל',jacket:11}]},
    {id:104,customer:4,event:E(-1),status:'picked',paid:true,fitting:'',note:'',lines:[{id:5,model:2,size:'6',child:'',jacket:18},{id:6,model:2,size:'8',child:'',jacket:20}]},
    {id:105,customer:5,event:E(9),status:'booked',paid:false,fitting:'',note:'',lines:[{id:7,model:1,size:'8',child:'נכד'}]},
    {id:106,customer:1,event:E(-20),status:'returned',paid:true,fitting:'',note:'',lines:[{id:8,model:1,size:'8',child:'יוסי',jacket:8,returned:true}]},
    {id:107,customer:2,event:E(16),status:'booked',paid:false,fitting:'',note:'',lines:[{id:9,model:1,size:'10',child:''},{id:10,model:1,size:'10',child:''}]},
  ];
  return {models,jackets,customers,orders,settings:{phone:'052-7614312',hour:9,sameDay:false},seq:{o:200,l:100,c:50},emails:[]};
}
const KEY='gemach-demo-v2';
let S;try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const M=id=>S.models.find(m=>m.id===id), C=id=>S.customers.find(c=>c.id===id), O=id=>S.orders.find(o=>o.id===id);
const J=id=>S.jackets.find(j=>j.id===id);
const live=o=>o.lines.filter(l=>!l.removed);
const total=o=>30*live(o).length;
const isLate=o=>o.status==='picked'&&T>ret(o)&&live(o).some(l=>!l.returned);
const debt=o=>(o.status==='picked'||o.status==='returned')&&!o.paid;
const sizeKey=s=>isNaN(+s)?[1,s]:[0,+s];
const cmpSize=(a,b)=>{const x=sizeKey(a),y=sizeKey(b);return x[0]-y[0]||(x[1]>y[1]?1:x[1]<y[1]?-1:0)};
const allSizes=()=>[...new Set(S.jackets.map(j=>j.size))].sort(cmpSize);

// ---------- availability (same rules as the real app) ----------
const gap=()=>S.settings.sameDay?2:3;
function occupying(event,excl){
  const out=[];
  S.orders.forEach(o=>{ if(o.id===excl||!(o.status==='booked'||o.status==='picked'))return;
    live(o).forEach(l=>{ if(l.returned)return;
      if(o.status==='picked'&&T>ret(o)) out.push({...l,order:o});
      else if(Math.abs(diff(o.event,event))<gap()) out.push({...l,order:o}); });});
  return out;
}
function avail(event,excl){
  const m=new Map(); const k=(a,b)=>a+'|'+b;
  S.jackets.filter(j=>j.active).forEach(j=>m.set(k(j.model,j.size),(m.get(k(j.model,j.size))||0)+1));
  occupying(event,excl).forEach(l=>m.set(k(l.model,l.size),(m.get(k(l.model,l.size))||0)-1));
  return m;
}
function checkLines(event,lines,excl){
  const a=avail(event,excl), need=new Map(), errs=[];
  lines.forEach(l=>need.set(l.model+'|'+l.size,(need.get(l.model+'|'+l.size)||0)+1));
  need.forEach((n,key)=>{const free=a.get(key)||0; const [m,s]=key.split('|'); if(n>free) errs.push(`${M(+m).name} מידה ${s}: מבוקשים ${n}, פנויים ${Math.max(free,0)}`)});
  return errs;
}
function shortages(){
  return S.orders.filter(o=>o.status==='booked'&&o.event>=T).map(o=>({o,errs:checkLines(o.event,live(o),o.id)})).filter(x=>x.errs.length);
}
function freeJackets(o,l){
  const taken=new Set(occupying(o.event,o.id).filter(x=>x.jacket).map(x=>x.jacket));
  return S.jackets.filter(j=>j.active&&j.model===l.model&&j.size===l.size&&!taken.has(j.id)).sort((a,b)=>a.tag-b.tag);
}

// ---------- ui helpers ----------
let toastT;
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(err?' error':'');t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3500)}
function mail(o,kind){const c=C(o.customer); if(!c.email) return ''; S.emails.push({order:o.id,kind,at:Date.now()}); return ` · מייל "${kind}" נשלח ל-${c.email} (בדמו — לא באמת)`;}
function status(o){
  let s=isLate(o)?'<span class="chip bad">באיחור</span>':o.status==='booked'?'<span class="chip">הוזמנה</span>':o.status==='picked'?'<span class="chip warn">נאספה</span>':o.status==='returned'?'<span class="chip ok">הוחזרה</span>':'<span class="chip muted">בוטלה</span>';
  return s+(debt(o)?' <span class="chip bad">חוב</span>':'');
}
const app=document.getElementById('app');
const go=h=>{ if(location.hash==='#'+h) render(); else location.hash=h; };

// ---------- screens ----------
const R={};
R.dash=()=>{
  const late=S.orders.filter(isLate), dis=S.jackets.filter(j=>!j.active), sh=shortages();
  const T1=iso(addD(TODAY,1));
  const pk=d=>S.orders.filter(o=>o.status==='booked'&&pickup(o)===d), rt=d=>S.orders.filter(o=>o.status==='picked'&&ret(o)===d);
  const tbl=(list,cols)=>list.length?`<table><tbody>${list.map(o=>`<tr><td><a href="#order-${o.id}">${esc(C(o.customer).name)}</a></td><td class="num">${C(o.customer).phone}</td>${cols(o)}</tr>`).join('')}</tbody></table>`:'<p class="empty">אין.</p>';
  const tags=o=>live(o).map(l=>J(l.jacket)?.tag).filter(Boolean).join(', ');
  return `<div class="guide"><b>איך מתחילים?</b> נסי ללחוץ על <b>+ הזמנה חדשה</b> ולהקליד את הטלפון 0527000001 (יש לו שני לקוחות). או פתחי את <b>משה כהן</b> באיסוף של היום וסמני איסוף.</div>
  <div class="head"><div><h1>מסך ראשי</h1><p class="sub" style="margin:0">${dDay(T)}, ${dLong(T)}</p></div>
  <form class="row" id="qa" style="align-items:flex-end"><label style="flex:0 0 190px">מה פנוי לשמחה בתאריך<input type="date" id="qd" required></label><button class="btn sec">בדיקה</button></form></div>
  <div class="grid">
  ${late.length?`<div class="alert bad"><h2>באיחור (${late.length})</h2><ul>${late.map(o=>`<li><a href="#order-${o.id}">${esc(C(o.customer).name)}</a> · ${C(o.customer).phone} · היה צריך לחזור ב-${dShort(ret(o))} · ז׳קט ${tags(o)}</li>`).join('')}</ul></div>`:''}
  ${sh.length?`<div class="alert bad"><h2>חסרים ז׳קטים להזמנות עתידיות</h2><ul>${sh.map(x=>`<li><a href="#order-${x.o.id}">${esc(C(x.o.customer).name)} · ${dLong(x.o.event)}</a> — ${x.errs.join('; ')}</li>`).join('')}</ul></div>`:''}
  ${dis.length?`<div class="alert warn"><h2>ז׳קטים מושבתים (${dis.length})</h2><ul>${dis.map(j=>`<li>${j.tag} · ${M(j.model).name} ${j.size}${j.note?' — '+esc(j.note):''}</li>`).join('')}</ul></div>`:''}
  <div class="grid g2">
    <div class="card"><h2>איסוף היום <span class="n">${dShort(T)} · ${pk(T).length}</span></h2>${tbl(pk(T),o=>`<td>${live(o).length} ז׳קטים</td><td class="num">${total(o)} ₪</td>`)}</div>
    <div class="card"><h2>איסוף מחר <span class="n">${dShort(T1)} · ${pk(T1).length}</span></h2>${tbl(pk(T1),o=>`<td>${live(o).length} ז׳קטים</td><td class="num">${total(o)} ₪</td>`)}</div>
    <div class="card"><h2>החזרה היום <span class="n">${dShort(T)} · ${rt(T).length}</span></h2>${tbl(rt(T),o=>`<td>ז׳קטים ${tags(o)}</td>`)}</div>
    <div class="card"><h2>החזרה מחר <span class="n">${dShort(T1)} · ${rt(T1).length}</span></h2>${tbl(rt(T1),o=>`<td>ז׳קטים ${tags(o)}</td>`)}</div>
  </div>
  ${S.orders.filter(debt).length?`<div class="card"><h2>חוב — נאסף ולא שולם</h2>${tbl(S.orders.filter(debt),o=>`<td>${dLong(o.event)}</td><td class="num">${total(o)} ₪</td>`)}</div>`:''}
  </div>`;
};
R.dash.after=()=>{document.getElementById('qa').onsubmit=e=>{e.preventDefault();availDate=document.getElementById('qd').value;go('avail')}};

let availDate=iso(addD(TODAY,1));
R.avail=()=>{
  const a=avail(availDate); const totals=new Map();
  S.jackets.filter(j=>j.active).forEach(j=>totals.set(j.model+'|'+j.size,(totals.get(j.model+'|'+j.size)||0)+1));
  const rows=[...a.entries()].map(([k,v])=>{const [m,s]=k.split('|');return {m:+m,s,free:v,total:totals.get(k)||0}})
    .sort((x,y)=>x.m-y.m||cmpSize(x.s,y.s));
  return `<h1>בדיקת זמינות</h1><p class="sub">מקלידים את תאריך השמחה ורואים מה פנוי. האיסוף יום לפני, וההחזרה יום אחרי.</p>
  <form class="card row" id="af" style="margin-bottom:16px"><label style="flex:0 0 200px">תאריך השמחה<input type="date" id="ad" value="${availDate}" required></label><button class="btn">בדיקה</button></form>
  <div class="card"><h2>פנוי לשמחה ב${dDay(availDate)}, ${dLong(availDate)} <span class="n">איסוף ${dShort(iso(addD(fromIso(availDate),-1)))} · החזרה ${dShort(iso(addD(fromIso(availDate),1)))}</span></h2>
  <div class="tw"><table><thead><tr><th>דגם</th><th>מידה</th><th>פנויים</th><th>מתוך</th><th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${M(r.m).name}</td><td class="num"><b>${r.s}</b></td><td class="num"><span class="free ${r.free>0?'':'zero'}">${Math.max(r.free,0)}</span>${r.free<0?` <span class="chip bad">חסר ${-r.free}</span>`:''}</td><td class="num hint">${r.total}</td>
  <td>${r.free>0?`<button class="btn sm sec" data-book="${r.m}|${r.s}">הזמנה</button>`:''}</td></tr>`).join('')}

};
R.avail.after=()=>{
  document.getElementById('af').onsubmit=e=>{e.preventDefault();availDate=document.getElementById('ad').value;render()};
  app.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>{const [m,s]=b.dataset.book.split('|');draft={event:availDate,lines:[{model:+m,size:s,child:''}]};go('new')});
};

let boardStart=T;
R.board=()=>{
  const days=[...Array(14)].map((_,i)=>iso(addD(fromIso(boardStart),i)));
  const per=days.map(d=>avail(d)); const keys=[...new Set(per.flatMap(a=>[...a.keys()]))].map(k=>{const [m,s]=k.split('|');return {k,m:+m,s}}).sort((x,y)=>x.m-y.m||cmpSize(x.s,y.s));
  return `<div class="head"><div><h1>לוח זמינות</h1><p class="sub" style="margin:0">כמה ז׳קטים פנויים לשמחה בכל תאריך. אדום — אין פנוי.</p></div>
  <div class="actions"><button class="btn sm sec" data-mv="-14">→ שבועיים קודמים</button><button class="btn sm sec" data-mv="14">שבועיים הבאים ←</button></div></div>
  <div class="card tw"><table class="board"><thead><tr><th>דגם · מידה</th>${days.map(d=>{const w=fromIso(d).getDay();return `<th class="${w>=5?'wk':''}">${DAYS[w].slice(0,3)}<br>${dShort(d)}</th>`}).join('')}</tr></thead>
  <tbody>${keys.map(r=>`<tr><td>${M(r.m).name} <b>${r.s}</b></td>${per.map(a=>{const v=Math.max(a.get(r.k)||0,0);return `<td class="num ${v===0?'z':v===1?'low':''}">${v}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
};
R.board.after=()=>app.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{boardStart=iso(addD(fromIso(boardStart),+b.dataset.mv));render()});

let ordQ='',ordAll=false;
R.orders=()=>{
  let list=S.orders.filter(o=>ordAll||o.status==='booked'||o.status==='picked');
  if(ordQ){const d=ordQ.replace(/\D/g,'');list=list.filter(o=>C(o.customer).name.includes(ordQ)||(d&&C(o.customer).phone.includes(d)))}
  list.sort((a,b)=>ordAll?b.event.localeCompare(a.event):a.event.localeCompare(b.event));
  return `<div class="head"><h1>הזמנות</h1><a class="btn copper" href="#new">+ הזמנה חדשה</a></div>
  <form class="card row" id="of" style="margin-bottom:16px"><label>חיפוש לפי שם או טלפון<input id="oq" value="${esc(ordQ)}"></label>
  <label style="flex:0 0 150px">להציג<select id="os"><option value="0">פתוחות</option><option value="1" ${ordAll?'selected':''}>הכל</option></select></label><button class="btn sec">חיפוש</button></form>
  <div class="card tw"><table><thead><tr><th>#</th><th>לקוח</th><th>טלפון</th><th>שמחה</th><th>ז׳קטים</th><th>מצב</th></tr></thead><tbody>
  ${list.map(o=>`<tr><td class="num"><a href="#order-${o.id}">${o.id}</a></td><td><a href="#order-${o.id}">${esc(C(o.customer).name)}</a></td><td class="num">${C(o.customer).phone}</td><td class="num">${dLong(o.event)}</td><td>${live(o).length}</td><td>${status(o)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">לא נמצאו הזמנות.</td></tr>'}
  </tbody></table></div>`;
};
R.orders.after=()=>document.getElementById('of').onsubmit=e=>{e.preventDefault();ordQ=document.getElementById('oq').value.trim();ordAll=document.getElementById('os').value==='1';render()};

// ----- new / edit order -----
let draft=null, editId=null;
function formHTML(o){
  const d=draft||(o?{phone:C(o.customer).phone,name:C(o.customer).name,email:C(o.customer).email,cid:o.customer,event:o.event,fitting:o.fitting,note:o.note,lines:live(o).map(l=>({...l}))}:{});
  const lines=(d.lines&&d.lines.length)?d.lines:[{model:'',size:'',child:''}];
  return `<h1>${o?'עריכת הזמנה '+o.id:'הזמנה חדשה'}</h1><p class="sub">האיסוף יום לפני השמחה, וההחזרה יום אחרי. ההזמנה נסגרת ברגע שלוחצים שמירה.</p>
  <div id="errs"></div>
  <form id="nf" class="grid">
  <div class="card grid"><h2>לקוח</h2>
    <div class="row"><label>טלפון<input id="phone" inputmode="tel" value="${esc(d.phone||'')}" required placeholder="נסי: 0527000001" autocomplete="off"></label>
    <label>שם<input id="name" value="${esc(d.name||'')}" autocomplete="off"></label>
    <label>מייל (לא חובה)<input id="email" type="email" value="${esc(d.email||'')}" autocomplete="off"></label></div>
    <input type="hidden" id="cid" value="${d.cid||''}">
    <div class="suggest" id="suggest" hidden></div><div class="hint" id="chosen" hidden></div>
  </div>
  <div class="card grid"><h2>שמחה וז׳קטים</h2>
    <div class="row"><label style="flex:0 0 200px">תאריך השמחה<input type="date" id="ev" value="${d.event||''}" required></label><span class="hint" id="dates"></span></div>
    <div id="lines" class="grid" style="gap:8px">${lines.map(lineHTML).join('')}</div>
    <datalist id="sizes">${allSizes().map(s=>`<option value="${s}">`).join('')}</datalist>
    <div><button type="button" class="btn sm sec" id="add">+ עוד ילד</button></div>
  </div>
  <div class="card grid"><h2>עוד</h2>
    <div class="row"><label>מדידה (מה סוכם בטלפון)<input id="fit" placeholder="למשל: יום ב׳ בערב" value="${esc(d.fitting||'')}"></label><label>הערה<input id="note" value="${esc(d.note||'')}"></label></div>
    <label class="check"><input type="checkbox" id="nomail"> לא לשלוח מייל ללקוח הפעם</label>
  </div>
  <div class="actions"><button class="btn copper">שמירת ההזמנה</button>${o?`<a class="btn sec" href="#order-${o.id}">ביטול עריכה</a>`:''}</div>
  </form>`;
}
function lineHTML(l){return `<div class="line"><input type="hidden" class="lid" value="${l.id||''}">
  <label>דגם<select class="lm" required><option value="">בחירה</option>${S.models.map(m=>`<option value="${m.id}" ${+l.model===m.id?'selected':''}>${m.name}</option>`).join('')}</select></label>
  <label>מידה<input class="ls" list="sizes" required value="${esc(l.size||'')}"></label>
  <label>שם הילד (לא חובה)<input class="lc" value="${esc(l.child||'')}"></label>
  <button type="button" class="btn sm danger rm">הסרה</button></div>`}
function formAfter(o){
  const $=id=>document.getElementById(id);
  const lines=$('lines');
  $('add').onclick=()=>{lines.insertAdjacentHTML('beforeend',lineHTML({}));lines.lastElementChild.querySelector('select').focus()};
  lines.onclick=e=>{if(e.target.classList.contains('rm')&&lines.children.length>1)e.target.closest('.line').remove()};
  const showDates=()=>{const v=$('ev').value;$('dates').textContent=v?`איסוף: ${dDay(iso(addD(fromIso(v),-1)))} ${dShort(iso(addD(fromIso(v),-1)))} · החזרה: ${dDay(iso(addD(fromIso(v),1)))} ${dShort(iso(addD(fromIso(v),1)))}`:''};
  $('ev').oninput=showDates; showDates();
  const phone=$('phone'),name=$('name'),email=$('email'),cid=$('cid'),box=$('suggest'),chosen=$('chosen');
  function newCust(){cid.value='';name.readOnly=false;name.value='';chosen.hidden=true;box.hidden=true;name.focus()}
  function showChosen(c){chosen.hidden=false;chosen.innerHTML=`לקוח קיים: <b>${esc(c.name)}</b>${c.notes?' · הערה: '+esc(c.notes):''} · <button type="button" class="btn sm sec" id="other">לקוח אחר עם אותו טלפון</button>`;document.getElementById('other').onclick=newCust}
  function choose(c){cid.value=c.id;name.value=c.name;name.readOnly=true;if(c.email&&!email.value)email.value=c.email;box.hidden=true;showChosen(c)}
  let last=phone.value.replace(/\D/g,'');
  function lookup(){
    const p=phone.value.replace(/\D/g,''); if(p===last&&box.hidden===false)return; last=p;
    if(p.length<9){box.hidden=true;return}
    const list=S.customers.filter(c=>c.phone===p);
    if(!list.length){if(cid.value)newCust();box.hidden=true;return}
    if(cid.value&&list.some(c=>String(c.id)===cid.value))return;
    box.innerHTML=`<div>${list.length===1?'הטלפון הזה כבר קיים. זה הלקוח?':'לטלפון הזה יש כמה לקוחות. מי מהם?'}</div><div class="who">${list.map(c=>{const n=S.orders.filter(o=>o.customer===c.id).length;return `<button type="button" class="btn sm" data-c="${c.id}">${esc(c.name)} (${n} הזמנות)</button>`}).join('')}<button type="button" class="btn sm sec" id="nc">לקוח אחר עם אותו טלפון</button></div>`;
    box.hidden=false;
    box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>choose(C(+b.dataset.c)));
    document.getElementById('nc').onclick=newCust;
  }
  phone.oninput=()=>{clearTimeout(phone._t);phone._t=setTimeout(lookup,250)};
  phone.onblur=lookup;
  if(cid.value){name.readOnly=true;showChosen(C(+cid.value))}
  $('nf').onsubmit=e=>{
    e.preventDefault();
    const ls=[...lines.children].map(r=>({id:+r.querySelector('.lid').value||null,model:+r.querySelector('.lm').value,size:r.querySelector('.ls').value.trim(),child:r.querySelector('.lc').value.trim()})).filter(l=>l.model&&l.size);
    const p=phone.value.replace(/\D/g,''), ev=$('ev').value, errs=[];
    draft={phone:phone.value,name:name.value,email:email.value,cid:cid.value?+cid.value:'',event:ev,fitting:$('fit').value,note:$('note').value,lines:ls};
    if(!ev)errs.push('חסר תאריך שמחה.'); else if(ev<T&&!o)errs.push('תאריך השמחה כבר עבר.');
    if(!ls.length)errs.push('צריך לפחות ז׳קט אחד.');
    if(p.length<9)errs.push('מספר טלפון לא תקין.');
    if(!cid.value&&!name.value.trim())errs.push('חסר שם לקוח.');
    if(!errs.length)errs.push(...checkLines(ev,ls,o?o.id:null));
    if(errs.length){$('errs').innerHTML=`<div class="alert bad" style="margin-bottom:16px"><h2>אי אפשר לשמור</h2><ul>${errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;window.scrollTo({top:0,behavior:'smooth'});return}
    let c;
    if(cid.value){c=C(+cid.value);if(email.value&&!c.email)c.email=email.value.trim()}
    else{c={id:++S.seq.c,name:name.value.trim(),phone:p,email:email.value.trim(),notes:''};S.customers.push(c)}
    let ord=o;
    if(!ord){ord={id:++S.seq.o,status:'booked',paid:false,lines:[]};S.orders.push(ord)}
    Object.assign(ord,{customer:c.id,event:ev,fitting:$('fit').value,note:$('note').value});
    ord.lines=ls.map(l=>({id:l.id||++S.seq.l,model:l.model,size:l.size,child:l.child}));
    const m=$('nomail').checked?'':mail(ord,o?'עדכון הזמנה':'אישור הזמנה');
    save(); draft=null; toast((o?'ההזמנה עודכנה':'ההזמנה נשמרה')+m); go('order-'+ord.id);
  };
}
R.new=()=>formHTML(null); R.new.after=()=>formAfter(null);

function orderAfter(o){
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{o.lines.find(l=>l.id===+b.dataset.rm).removed=true;const m=mail(o,'עדכון הזמנה');save();toast('השורה הוסרה'+m);render()});
  const pf=document.getElementById('pf');
  if(pf)pf.onsubmit=e=>{e.preventDefault();
    const sel=[...pf.querySelectorAll('select[data-line]')].map(s=>[+s.dataset.line,+s.value]);
    const ids=sel.map(x=>x[1]); if(new Set(ids).size!==ids.length){toast('אותו ז׳קט נבחר פעמיים',true);return}
    sel.forEach(([lid,jid])=>o.lines.find(l=>l.id===lid).jacket=jid);
    o.status='picked';o.paid=document.getElementById('paid').checked;save();toast('סומן כנאסף.'+(o.paid?'':' ההזמנה מסומנת ״חוב״.'));render()};
  const rf=document.getElementById('rf');
  if(rf)rf.onsubmit=e=>{e.preventDefault();
    const ret=new Set([...rf.querySelectorAll('[data-ret]:checked')].map(x=>+x.dataset.ret)), dmg=new Set([...rf.querySelectorAll('[data-dmg]:checked')].map(x=>+x.dataset.dmg));
    if(!ret.size){toast('לא סומן אף ז׳קט',true);return}
    let disabled=0;
    live(o).forEach(l=>{if(ret.has(l.id)&&!l.returned){l.returned=true;if(dmg.has(l.id)){l.damaged=true;const j=J(l.jacket);j.active=false;j.note=document.getElementById('dn').value.trim()||`חזר פגום מהזמנה ${o.id}`;disabled++}}});
    if(live(o).every(l=>l.returned))o.status='returned';
    save();toast('ההחזרה נרשמה.'+(disabled?' ז׳קט פגום הושבת.':''));render()};
  app.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;
    if(a==='paid'){o.paid=true;toast('סומן ששולם.')}
    if(a==='stop'){o.stopLate=!o.stopLate;toast(o.stopLate?'תזכורות האיחור נעצרו.':'תזכורות האיחור חודשו.')}
    if(a==='resend'){toast('נשלח'+mail(o,'אישור הזמנה'))}
    if(a==='cancel'){o.status='cancelled';const m=document.getElementById('cnm').checked?'':mail(o,'ביטול');toast('ההזמנה בוטלה והז׳קטים התפנו.'+m)}
    save();render()});
}

// ----- inventory -----
R.inventory=()=>{
  const next=Math.max(0,...S.jackets.map(j=>j.tag))+1;
  return `<h1>ז׳קטים ודגמים</h1><p class="sub">${S.jackets.length} ז׳קטים במלאי.</p>
  <div class="grid g2">
    <div class="card grid"><h2>דגמים</h2>${S.models.map(m=>`<div class="row" style="align-items:center"><span class="mthumb" style="background:${m.id===1?'#1d1d1d':'#EFE6D2'};color:${m.id===1?'#ccc':'#776'}">תמונה</span><b style="flex:1">${m.name}</b><span class="hint">${S.jackets.filter(j=>j.model===m.id).length} ז׳קטים</span></div>`).join('')}
    <p class="hint" style="margin:0">במערכת האמיתית מעלים כאן תמונה לכל דגם.</p></div>
    <form class="card grid" id="jf"><h2>הוספת ז׳קט</h2><div class="row">
      <label style="flex:0 0 110px">מספר תגית<input id="jt" type="number" min="1" value="${next}" required></label>
      <label>דגם<select id="jm">${S.models.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></label>
      <label style="flex:0 0 110px">מידה<input id="js" list="sz" required></label></div>
      <datalist id="sz">${allSizes().map(s=>`<option value="${s}">`).join('')}</datalist><div><button class="btn">הוספה</button></div></form>
  </div>
  <div class="card tw" style="margin-top:16px"><table><thead><tr><th>תגית</th><th>דגם</th><th>מידה</th><th>מצב</th><th></th></tr></thead><tbody>
  ${[...S.jackets].sort((a,b)=>a.tag-b.tag).map(j=>`<tr><td class="num"><b>${j.tag}</b></td><td>${M(j.model).name}</td><td class="num">${j.size}</td>
  <td>${j.active?'<span class="chip ok">פעיל</span>':`<span class="chip warn">מושבת</span> ${esc(j.note)}`}</td>
  <td><div class="actions">${j.active?`<input data-note="${j.id}" placeholder="סיבת השבתה" style="width:150px"><button class="btn sm sec" data-dis="${j.id}">השבתה</button>`:`<button class="btn sm" data-en="${j.id}">החזרה לפעיל</button>`}</div></td></tr>`).join('')}
  </tbody></table></div>`;
};
R.inventory.after=()=>{
  document.getElementById('jf').onsubmit=e=>{e.preventDefault();const tag=+document.getElementById('jt').value,size=document.getElementById('js').value.trim();
    if(S.jackets.some(j=>j.tag===tag)){toast(`מספר תגית ${tag} כבר קיים.`,true);return}
    S.jackets.push({id:Math.max(...S.jackets.map(j=>j.id))+1,tag,model:+document.getElementById('jm').value,size,active:true,note:''});save();toast(`ז׳קט ${tag} נוסף.`);render()};
  app.querySelectorAll('[data-dis]').forEach(b=>b.onclick=()=>{const j=J(+b.dataset.dis);j.active=false;j.note=app.querySelector(`[data-note="${j.id}"]`).value.trim();save();toast(`ז׳קט ${j.tag} הושבת.`);render()});
  app.querySelectorAll('[data-en]').forEach(b=>b.onclick=()=>{const j=J(+b.dataset.en);j.active=true;j.note='';save();toast(`ז׳קט ${j.tag} חזר לפעיל.`);render()});
};

// ----- customers -----
let custQ='';
R.customers=()=>{
  const d=custQ.replace(/\D/g,''); const list=S.customers.filter(c=>!custQ||c.name.includes(custQ)||(d&&c.phone.includes(d))).sort((a,b)=>a.name.localeCompare(b.name,'he'));
  return `<h1>לקוחות</h1><p class="sub">אותו טלפון יכול להופיע אצל כמה בני משפחה.</p>
  <form class="card row" id="cf" style="margin-bottom:16px"><label>חיפוש לפי שם או טלפון<input id="cq" value="${esc(custQ)}"></label><button class="btn sec">חיפוש</button></form>
  <div class="card tw"><table><thead><tr><th>שם</th><th>טלפון</th><th>מייל</th><th>הזמנות</th></tr></thead><tbody>
  ${list.map(c=>`<tr><td><a href="#customer-${c.id}">${esc(c.name)}</a></td><td class="num">${c.phone}</td><td>${esc(c.email)||'—'}</td><td>${S.orders.filter(o=>o.customer===c.id).length}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">לא נמצאו לקוחות.</td></tr>'}</tbody></table></div>`;
};
R.customers.after=()=>document.getElementById('cf').onsubmit=e=>{e.preventDefault();custQ=document.getElementById('cq').value.trim();render()};
function custView(c){
  const os=S.orders.filter(o=>o.customer===c.id).sort((a,b)=>b.event.localeCompare(a.event));
  return `<h1>${esc(c.name)}</h1><p class="sub">${os.length} הזמנות</p><div class="grid g2">
  <form class="card grid" id="cdf"><h2>פרטים</h2><div class="row"><label>שם<input id="cn" value="${esc(c.name)}" required></label><label>טלפון<input id="cp" value="${c.phone}" required></label></div>
  <label>מייל<input id="ce" type="email" value="${esc(c.email)}"></label><label>הערות (רק את רואה)<textarea id="cnotes" rows="3">${esc(c.notes)}</textarea></label><div><button class="btn">שמירה</button></div></form>
  <div class="card"><h2>הזמנות</h2><table><tbody>${os.map(o=>`<tr><td><a href="#order-${o.id}">${dLong(o.event)}</a></td><td>${live(o).length} ז׳קטים</td><td>${status(o)}</td></tr>`).join('')||'<tr><td class="empty">אין הזמנות.</td></tr>'}</tbody></table></div></div>`;
}
function custAfter(c){document.getElementById('cdf').onsubmit=e=>{e.preventDefault();c.name=document.getElementById('cn').value.trim()||c.name;c.phone=document.getElementById('cp').value.replace(/\D/g,'');c.email=document.getElementById('ce').value.trim();c.notes=document.getElementById('cnotes').value;save();toast('הפרטים נשמרו.');render()}}

// ----- settings -----
R.settings=()=>`<h1>הגדרות</h1><p class="sub">במערכת האמיתית יש כאן גם עריכה של נוסחי המיילים.</p>
  <form class="card grid" id="sf"><div class="row"><label>טלפון הגמ״ח<input id="sp" value="${esc(S.settings.phone)}"></label>
  <label>שעת שליחת תזכורות<select id="sh">${[...Array(17)].map((_,i)=>i+6).map(h=>`<option ${h===S.settings.hour?'selected':''}>${h}:00</option>`).join('')}</select></label></div>
  <label class="check"><input type="checkbox" id="ssd" ${S.settings.sameDay?'checked':''}> ז׳קט שמוחזר ביום מסוים יכול לצאת ללקוח אחר באותו יום</label>
  <p class="hint" style="margin:0">נסי לסמן ולחזור ללוח הזמינות — המספרים ישתנו.</p>
  <div><button class="btn copper">שמירה</button></div></form>`;
R.settings.after=()=>document.getElementById('sf').onsubmit=e=>{e.preventDefault();S.settings.phone=document.getElementById('sp').value;S.settings.hour=parseInt(document.getElementById('sh').value);S.settings.sameDay=document.getElementById('ssd').checked;save();toast('ההגדרות נשמרו.')};

// ---------- router ----------
function render(){
  const h=(location.hash||'#dash').slice(1); let key=h, html, after;
  let m;
  if((m=h.match(/^order-(\d+)$/))&&O(+m[1])){const o=O(+m[1]);html=orderView(o);after=()=>orderAfter(o);key='orders'}
  else if((m=h.match(/^edit-(\d+)$/))&&O(+m[1])){const o=O(+m[1]);html=formHTML(o);after=()=>formAfter(o);key='orders'}
  else if((m=h.match(/^customer-(\d+)$/))&&C(+m[1])){const c=C(+m[1]);html=custView(c);after=()=>custAfter(c);key='customers'}
  else{ if(!R[h])key='dash'; html=R[key](); after=R[key].after; }
  if(key!=='new'&&!h.startsWith('edit-'))draft=null;
  app.innerHTML=html; after&&after();
  document.querySelectorAll('#nav a[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===key));
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
document.getElementById('reset').onclick=()=>{S=seed();save();availDate=iso(addD(TODAY,1));boardStart=T;toast('הדמו אופס לנתוני ההתחלה.');go('dash')};
render();
</script>
