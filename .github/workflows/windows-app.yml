# בונה קובץ התקנה לווינדוס ומפרסם אותו ב-Releases של הריפו.
name: Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r desktop/requirements.txt

      - name: Tests
        run: python manage.py test gemach

      - name: Collect static
        env: { DEBUG: "0", SECRET_KEY: build-only }
        run: python manage.py collectstatic --no-input

      - name: Package
        working-directory: desktop
        run: pyinstaller gemach.spec --noconfirm --distpath ../build/dist --workpath ../build/work

      - name: Installer
        shell: pwsh
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc desktop\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: גרסה 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            קובץ התקנה למחשב (ווינדוס): מורידים את GemachSuits-Setup.exe ולוחצים עליו פעמיים.
            הנתונים נשמרים במחשב ולא נמחקים בעדכון.
          files: build/installer/GemachSuits-Setup.exe
