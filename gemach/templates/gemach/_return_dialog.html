<dialog id="dlg-in-{{ o.pk }}"><form method="post" action="{% url 'order_return' o.pk %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.path }}">
  <header><h3>החזרה · {{ o.customer.name }}</h3><button class="x" type="button" data-close aria-label="סגירה">×</button></header>
  <div class="body">
    <table><thead><tr><th>ז׳קט</th><th>הוחזר</th><th>פגום</th></tr></thead><tbody>
    {% for l in o.live_lines %}{% if not l.returned %}<tr><td>#{{ l.jacket.tag }} · {{ l.model.name }} {{ l.size }}</td><td><input type="checkbox" name="returned" value="{{ l.id }}" checked aria-label="הוחזר"></td><td><input type="checkbox" name="damaged" value="{{ l.id }}" aria-label="פגום"></td></tr>{% endif %}{% endfor %}
    </tbody></table>
    <label>אם פגום — מה הבעיה?<input name="damage_note" placeholder="למשל: כפתור חסר"></label>
  </div>
  <footer><div class="l"><button class="btn">רישום החזרה</button><button class="btn ghost" type="button" data-close>ביטול</button></div></footer>
</form></dialog>
