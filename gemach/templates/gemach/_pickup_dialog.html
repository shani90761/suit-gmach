<dialog id="dlg-out-{{ o.pk }}"><form method="post" action="{% url 'order_pickup' o.pk %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.path }}">
  <header><h3>איסוף · {{ o.customer.name }}</h3><button class="x" type="button" data-close aria-label="סגירה">×</button></header>
  <div class="body">
    {% for l, free in options %}<div class="fld"><span class="lbl">{{ l.model.name }} {{ l.size }}<small>{{ l.child_name|default:"ילד" }}</small></span>
      {% if free %}<select name="jacket_{{ l.id }}" required aria-label="מספר ז׳קט">{% for j in free %}<option value="{{ j.id }}" {% if forloop.counter0 == forloop.parentloop.counter0 %}selected{% endif %}>ז׳קט {{ j.tag }}</option>{% endfor %}</select>
      {% else %}<span class="chip bad">אין ז׳קט פנוי</span>{% endif %}</div>{% endfor %}
    <div class="paid"><label class="check"><input type="checkbox" name="paid" value="1" checked> שולם במזומן</label><span class="sum">{{ o.total }} ₪</span></div>
  </div>
  <footer><div class="l"><button class="btn">סימון כנאסף</button><button class="btn ghost" type="button" data-close>ביטול</button></div></footer>
</form></dialog>
